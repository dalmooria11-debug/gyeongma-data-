name: fetch
on:
  schedule:
    - cron: "30 22 * * 4,5,6"
    - cron: "0 10 * * 5,6,0"
  workflow_dispatch:
    inputs:
      dates:
        description: "YYYYMMDD (space separated, optional)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fetch.py ${{ github.event.inputs.dates }}
        env:
          KRA_KEY: ${{ secrets.KRA_KEY }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data $(date -u +%F_%H%M)"
          git push
